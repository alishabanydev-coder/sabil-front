<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Sabeel Kids</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f5f0ff;
        font-family: system-ui, sans-serif;
        background:
          radial-gradient(
            ellipse 80% 60% at 20% 15%,
            rgba(255, 76, 99, 0.28),
            transparent 55%
          ),
          radial-gradient(
            ellipse 70% 55% at 85% 80%,
            rgba(94, 146, 252, 0.22),
            transparent 50%
          ),
          radial-gradient(
            ellipse 50% 40% at 50% 50%,
            rgba(92, 12, 151, 0.55),
            transparent 70%
          ),
          linear-gradient(160deg, #1a0630 0%, #12041f 45%, #0a0214 100%);
      }

      .card {
        width: min(100%, 520px);
        text-align: center;
      }

      .icon {
        width: 96px;
        height: 96px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 28%;
        border: 2px solid rgba(223, 255, 0, 0.35);
        background: rgba(255, 255, 255, 0.06);
        box-shadow:
          0 0 0 8px rgba(223, 255, 0, 0.06),
          0 18px 40px rgba(0, 0, 0, 0.45);
      }

      h1 {
        color: #ff4c63;
        font-size: 4rem;
        line-height: 1;
        letter-spacing: 3px;
      }

      h2 {
        margin-top: 12px;
        font-size: 1.35rem;
      }

      p {
        margin: 14px auto 0;
        max-width: 400px;
        color: rgba(245, 240, 255, 0.72);
        line-height: 1.55;
      }

      #hint {
        color: #dfff00;
        font-weight: 700;
      }

      button {
        margin-top: 22px;
        min-width: 170px;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        background: #dfff00;
        color: #121212;
        font: inherit;
        font-weight: 800;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.7;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main class="card" role="alert">
      <div class="icon" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 18.5h.01M8.5 15.2a5 5 0 0 1 7 0M5.8 12.4a9 9 0 0 1 12.4 0"
            stroke="#dfff00"
            stroke-width="1.8"
            stroke-linecap="round"
          />
          <path
            d="M4 5l16 16"
            stroke="#ff4c63"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <h1>Oops!</h1>
      <h2>No connection</h2>
      <p>
        Sabeel Kids needs the internet to open. Check Wi-Fi or mobile data,
        then try again.
      </p>
      <p id="hint" hidden>
        Still offline. Check the connection, then try again.
      </p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var APP_URL = "https://sabeelkids.sabeelgroup.org/app";
      var hint = document.getElementById("hint");
      var button = document.getElementById("retry");

      if (sessionStorage.getItem("sabeel-offline-retry") === "1") {
        sessionStorage.removeItem("sabeel-offline-retry");
        hint.hidden = false;
      }

      button.addEventListener("click", function () {
        button.disabled = true;
        button.textContent = "Checking…";
        sessionStorage.setItem("sabeel-offline-retry", "1");
        window.location.href = APP_URL;
      });
    </script>
  </body>
</html>
